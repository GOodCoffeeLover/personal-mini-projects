apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: lab-cluster
spec:
  controlPlane:
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: KubeadmControlPlaneTemplate
      name: lab-cluster-control-plane
    machineInfrastructure:
      templateRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: RemoteMachineTemplate
        name: lab-cluster
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
      kind: RemoteClusterTemplate
      name: lab-cluster
  variables:
    - name: imageRepository
      required: true
      schema:
        openAPIV3Schema:
          type: string
          default: ""
          example: "registry.k8s.io"
          description: "imageRepository sets the container registry to pull images from. If empty, nothing will be set and the from of kubeadm will be used."
  patches:
    - name: imageRepository
      description: "Sets the imageRepository used for the KubeadmControlPlane."
      enabledIf: '{{ ne .imageRepository "" }}'
      definitions:
        - selector:
            apiVersion: controlplane.cluster.x-k8s.io/v1beta2
            kind: KubeadmControlPlaneTemplate
            matchResources:
              controlPlane: true
          jsonPatches:
            - op: add
              path: "/spec/template/spec/kubeadmConfigSpec/clusterConfiguration/imageRepository"
              valueFrom:
                variable: imageRepository
