apiVersion: addons.cluster.x-k8s.io/v1alpha1
kind: HelmChartProxy
metadata:
  name: lab-cluster-argo-cd
  labels:
    clusterctl.cluster.x-k8s.io/move: ""
spec:
  reconcileStrategy: InstallOnce
  clusterSelector:
    matchLabels:
      homelab.cluster.x-k8s.io/addons: lab-cluster
  repoURL: https://argoproj.github.io/argo-helm
  chartName: argo-cd
  version: 10.9.6
  releaseName: argocd
  namespace: argocd
  options:
    wait: true
    timeout: 20m
    install:
      createNamespace: true
  # Shared values match applications/argocd.yaml; bootstrap uses ClusterIP so Helm
  # can finish before Argo CD applies Cilium's LB pool and L2 policy.
  valuesTemplate: |
    server:
      service:
        type: ClusterIP
    redis:
      image:
        repository: docker.io/library/redis
        tag: 8.6.4-alpine
