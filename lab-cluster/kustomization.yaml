apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
- ssh-key-secret.yaml
- remote-machine-template.yaml
- remote-cluster-template.yaml
- kubeadm-control-plane-template.yaml
- cluster-class.yaml
- pooled-remote-machine.yaml
# - cluster.yaml

secretGenerator:
- name: lab-cluster-node-scripts
  files:
  - capi-node-cleanup.sh=scripts/capi-node-cleanup.sh
  - setup-kube.sh=scripts/setup-kube.sh
  - setup-kube-vip.sh=scripts/setup-kube-vip.sh

configurations:
- kustomizeconfig.yaml
