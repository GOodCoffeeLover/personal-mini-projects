kind: KubeadmControlPlaneTemplate
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
metadata:
  name: test-test-control-plane
spec:
  template:
    spec:
      kubeadmConfigSpec:
        files:
        - path: /usr/local/sbin/capi-node-cleanup
          owner: root:root
          permissions: "0755"
          content: |
            #!/usr/bin/env bash
            set -euxo pipefail

            # kubeadm reset сам остановит kubelet и очистит
            # /etc/kubernetes и /var/lib/kubelet
            kubeadm reset -f --cleanup-tmp-dir

            # kubeadm это сознательно не чистит
            rm -rf /etc/cni/net.d
            rm -rf /var/lib/cni
        - path: /usr/local/sbin/setup-kube
          owner: root:root
          permissions: "0755"
          contentFormat: Template
          content: |
            set -Eeuo pipefail

            case "$(uname -m)" in
              x86_64)
                ARCH="amd64"
                ;;
              aarch64 | arm64)
                ARCH="arm64"
                ;;
              *)
                echo "Unsupported architecture: $(uname -m)" >&2
                exit 1
                ;;
            esac

            RELEASE="{{ .controlPlane.version }}"
            RELEASE="${RELEASE#v}"
            if [[ "$RELEASE" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+([+-].*)?$ ]]; then
              CRICTL_VERSION="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.0"
              RELEASE="v${RELEASE}"
            else
              echo "Unsupported Kubernetes version: ${RELEASE}" >&2
              exit 1
            fi

            RELEASE_VERSION="v0.21.1"
            CONTAINERD_VERSION="2.3.5"
            RUNC_VERSION="1.5.1"
            CNI_PLUGINS_VERSION="v1.9.1"

            curl -L "https://github.com/containerd/containerd/releases/download/v${CONTAINERD_VERSION}/containerd-${CONTAINERD_VERSION}-linux-${ARCH}.tar.gz" | sudo tar -C "/usr/local" -xz
            mkdir -p "/etc/containerd/"
            containerd config default \
            | sed  "s/SystemdCgroup = false/SystemdCgroup = true/g"\
            | sudo tee /etc/containerd/config.toml

            CONTAINERD_SYSTEMD_DIR="/usr/local/lib/systemd/system/"
            mkdir -p $CONTAINERD_SYSTEMD_DIR
            curl -L -o "${CONTAINERD_SYSTEMD_DIR}/containerd.service" "https://raw.githubusercontent.com/containerd/containerd/main/containerd.service"
            systemctl daemon-reload
            systemctl enable --now containerd

            curl -L -o runc "https://github.com/opencontainers/runc/releases/download/v${RUNC_VERSION}/runc.${ARCH}"
            install -m 755 runc /usr/local/sbin/runc

            DEST="/opt/cni/bin"
            sudo mkdir -p "$DEST"
            curl -L "https://github.com/containernetworking/plugins/releases/download/${CNI_PLUGINS_VERSION}/cni-plugins-linux-${ARCH}-${CNI_PLUGINS_VERSION}.tgz" | sudo tar -C "$DEST" -xz


            DOWNLOAD_DIR="/usr/local/bin"
            sudo mkdir -p "$DOWNLOAD_DIR"
            curl -L "https://github.com/kubernetes-sigs/cri-tools/releases/download/${CRICTL_VERSION}/crictl-${CRICTL_VERSION}-linux-${ARCH}.tar.gz" | sudo tar -C $DOWNLOAD_DIR -xz

            cd $DOWNLOAD_DIR
            sudo curl -L --remote-name-all https://dl.k8s.io/release/${RELEASE}/bin/linux/${ARCH}/{kubeadm,kubelet,kubectl}
            sudo chmod +x ${DOWNLOAD_DIR}/{kubeadm,kubelet,kubectl}

            curl -sSL "https://raw.githubusercontent.com/kubernetes/release/${RELEASE_VERSION}/cmd/krel/templates/latest/kubelet/kubelet.service" | sed "s:/usr/bin:${DOWNLOAD_DIR}:g" | sudo tee /usr/lib/systemd/system/kubelet.service
            sudo mkdir -p /usr/lib/systemd/system/kubelet.service.d
            curl -sSL "https://raw.githubusercontent.com/kubernetes/release/${RELEASE_VERSION}/cmd/krel/templates/latest/kubeadm/10-kubeadm.conf" | sed "s:/usr/bin:${DOWNLOAD_DIR}:g" | sudo tee /usr/lib/systemd/system/kubelet.service.d/10-kubeadm.conf
            sudo systemctl enable --now kubelet


            cat <<EOF | sudo tee /etc/sysctl.d/k8s.conf
            net.ipv4.ip_forward = 1
            EOF

            # Apply sysctl params without reboot
            sudo sysctl --system

            sudo apt update && \
            sudo apt install socat iptables iproute2 mount conntrack util-linux ethtool libc6 -y


            swapoff -a
            sed '/swap\.img/d' /etc/fstab > /tmp/fstab
            mv /tmp/fstab /etc/fstab
        preKubeadmCommands:
        - '/bin/bash /usr/local/sbin/setup-kube || exit $?'
