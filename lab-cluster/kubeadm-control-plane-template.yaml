kind: KubeadmControlPlaneTemplate
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
metadata:
  name: lab-cluster-control-plane-v2
spec:
  template:
    metadata:
      annotations:
        controlplane.cluster.x-k8s.io/skip-kube-proxy: "true"
    spec:
      kubeadmConfigSpec:
        initConfiguration:
          skipPhases:
          - addon/kube-proxy
        files:
        - path: /usr/local/sbin/capi-node-cleanup
          owner: root:root
          permissions: "0755"
          contentFrom:
            secret:
              name: lab-cluster-node-scripts
              key: capi-node-cleanup.sh
        - path: /usr/local/sbin/setup-kube
          owner: root:root
          permissions: "0755"
          contentFormat: Template
          contentFrom:
            secret:
              name: lab-cluster-node-scripts
              key: setup-kube.sh
        - path: /usr/local/sbin/setup-kube-vip
          owner: root:root
          permissions: "0755"
          contentFrom:
            secret:
              name: lab-cluster-node-scripts
              key: setup-kube-vip.sh
        preKubeadmCommands:
        - '/bin/bash /usr/local/sbin/setup-kube || exit $?'
        - '/bin/bash /usr/local/sbin/setup-kube-vip || exit $?'
