apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-cluster-applications
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/GOodCoffeeLover/personal-mini-projects.git
    targetRevision: main
    path: lab-cluster/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
