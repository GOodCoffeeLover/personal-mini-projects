apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.cilium.io
    chart: cilium
    targetRevision: 1.20.2
    helm:
      releaseName: cilium
      # Keep chart version and values aligned with cluster/addons/cillium.yaml.
      valuesObject:
        kubeProxyReplacement: "true"
        k8sServiceHost: 10.60.80.1
        k8sServicePort: 6443
        ipam:
          mode: cluster-pool
          operator:
            clusterPoolIPv4PodCIDRList:
            - 10.129.0.0/16
        operator:
          replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  # Helm lookup reuses these certificates; Argo CD's offline render generates new ones.
  ignoreDifferences:
  - group: ""
    kind: Secret
    name: cilium-ca
    namespace: kube-system
    jsonPointers:
    - /data/ca.crt
    - /data/ca.key
  - group: ""
    kind: Secret
    name: hubble-server-certs
    namespace: kube-system
    jsonPointers:
    - /data/ca.crt
    - /data/tls.crt
    - /data/tls.key
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - Prune=false
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
