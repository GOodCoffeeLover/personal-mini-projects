apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 10.9.6
    helm:
      releaseName: argocd
      # Keep chart version and values aligned with cluster/addons/argocd.yaml.
      valuesObject:
        redis:
          image:
            repository: docker.io/library/redis
            tag: 8.6.4-alpine
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - Prune=false
    - ServerSideApply=true
