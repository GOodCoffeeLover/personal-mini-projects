apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 10.9.6
    helm:
      releaseName: argocd
      # Keep chart version and shared values aligned with cluster/addons/argocd.yaml.
      # Bootstrap keeps ClusterIP until Cilium's pool and L2 policy are ready.
      valuesObject:
        server:
          service:
            type: LoadBalancer
            loadBalancerClass: io.cilium/l2-announcer
            externalTrafficPolicy: Cluster
            annotations:
              lbipam.cilium.io/ips: "10.60.80.2"
        redis:
          image:
            repository: docker.io/library/redis
            tag: 8.6.4-alpine
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - Prune=false
    - ServerSideApply=true
